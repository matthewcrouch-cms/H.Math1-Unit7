async function joinLive(code,name,demo){
  const err=m=>{const e=$('#err');if(e)e.textContent=m;};
  if(!/^[A-Z]{4}$/.test(code)) return err('Enter the 4-letter class code.');
  if(!name) return err('Enter your name.');
  err('Joining…');
  try{
    const st=await DB.once(`sessions/${code}/state`);
    if(!st) return err('No class found with that code. Check with your teacher.');
    if((await DB.once(`sessions/${code}/app`))!==APP) return err('That code is for a different activity.');
    const studs=await DB.once(`sessions/${code}/students`)||{};
    const saved=LS.get('cannon:live');
    let sid=(saved&&saved.code===code&&studs[saved.sid]&&(studs[saved.sid].name||'').toLowerCase()===name.toLowerCase())?saved.sid:null;
    if(!sid) sid=Object.keys(studs).find(k=>(studs[k].name||'').trim().toLowerCase()===name.toLowerCase())||null;
    let work=sid&&studs[sid]?studs[sid].work:null;
    if(!sid) sid='s'+Math.random().toString(36).slice(2,10);
    LIVE={code,sid,name,demo}; LS.set('cannon:live',{code,sid,name,demo});
    state=merge(work); firstState=true;
    await DB.update(`sessions/${code}/students/${sid}`,{name,demo:!!demo,stage:state.stage,joined:DB.ts(),seen:DB.ts(),work:JSON.parse(JSON.stringify(state))});
    startLive();
  }catch(e){ err('Could not connect. Ask your teacher to check the setup.'); }
}
function startLive(){
  cleanup();
  unsubs.push(DB.on(`${base()}/state`,st=>{
    if(!st){ LS.del('cannon:live'); return showJoin('That class session has ended.'); }
    const prev=CLS.stage; CLS={stage:st.stage||1,freeze:!!st.freeze};
    $('#freeze').hidden=!CLS.freeze||!!(LIVE&&LIVE.demo);
    if(firstState){ firstState=false; state.stage=CLS.stage; persist(); render(); return; }
    if(CLS.stage!==prev){ go(CLS.stage); return; }
  }));
  unsubs.push(DB.on(`${base()}/kicked/${LIVE.sid}`,k=>{ if(k){ DB.remove(`${base()}/kicked/${LIVE.sid}`); LS.del('cannon:live'); LIVE=null; showJoin('You were removed from the class. Rejoin with your correct name.'); } }));
  heartbeat=setInterval(()=>{ if(LIVE) DB.update(`${base()}/students/${LIVE.sid}`,{seen:DB.ts(),stage:state.stage}).catch(()=>{}); },30000);
}
function startSolo(){
  cleanup(); LIVE=null; LS.del('cannon:live');
  state=merge(LS.get(KEY)); if(teacherAll) state.unlocked=4;
  if(state.stage>state.unlocked) state.stage=state.unlocked;
  render();
}

/* ---------- cannon scene ---------- */
let sim=null;
function stopSim(){if(sim){cancelAnimationFrame(sim.raf);sim=null;}}
function CannonScene(container,{H,h0,f,ghost=null,tEnd,step=500}){
  const s=H/100, y=v=>H-v, W=52*s;
  let ticks=''; for(let v=0;v<=H;v+=step) ticks+=`<line class="ruler" x1="${30*s}" x2="${32.5*s}" y1="${y(v)}" y2="${y(v)}"/><text class="rtk" x="${33.5*s}" y="${y(v)+1*s}" font-size="${2.9*s}">${v.toLocaleString()}</text>`;
  const ph=Math.max(h0,1.4*s);
  container.innerHTML=`<svg class="cscene" viewBox="${-6*s} ${-9*s} ${W} ${H+19*s}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A cannonball launched straight up">
    <defs><linearGradient id="skyc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9DCF4"/><stop offset="1" stop-color="#F4F9FD"/></linearGradient></defs>
    <rect x="${-6*s}" y="${-9*s}" width="${W}" height="${H+9*s}" fill="url(#skyc)"/>
    <rect x="${-6*s}" y="${H}" width="${W}" height="${10*s}" class="ground"/>
    <rect x="${4*s}" y="${H-ph}" width="${14*s}" height="${ph}" fill="#8A7E66"/>
    <rect x="${9.4*s}" y="${H-ph-7*s}" width="${3.2*s}" height="${7*s}" rx="${.6*s}" fill="#33405A"/>
    <circle cx="${8.8*s}" cy="${H-ph-1.4*s}" r="${1.6*s}" fill="#5B6678"/><circle cx="${13.2*s}" cy="${H-ph-1.4*s}" r="${1.6*s}" fill="#5B6678"/>
    <line class="ruler" x1="${30*s}" x2="${30*s}" y1="0" y2="${H}"/>${ticks}
    <text x="${30*s}" y="${-5*s}" font-size="${2.9*s}" fill="#33405A" font-weight="700" text-anchor="middle">feet</text>
    <circle class="gball" cx="${11*s}" cy="${y(h0)}" r="${1.7*s}" ${ghost?'':'style="display:none"'}/>
    <circle class="ball" cx="${11*s}" cy="${y(h0)}" r="${1.9*s}"/>
    <g class="off"></g>
    <text class="splat" x="${11*s}" y="${H+6.5*s}" font-size="${3.6*s}" text-anchor="middle"></text>
  </svg>`;
  const svg=container.querySelector('svg');
  const self={tEnd,t:0};
  self.set=t=>{
    t=clamp(t,0,tEnd); self.t=t;
    const v=Math.max(0,f(t)); let off='';
    const b=svg.querySelector('.ball'); b.setAttribute('cy',y(Math.min(v,H+4*s))); b.style.display=v>H+3*s?'none':'';
    if(v>H+3*s) off+=`<text x="${11*s}" y="${-2*s}" font-size="${3*s}" text-anchor="middle" fill="#13294B" font-weight="700">↑ ${Math.round(v).toLocaleString()} ft</text>`;
    if(ghost){ const g=ghost(t), gb=svg.querySelector('.gball'); gb.setAttribute('cy',y(Math.min(g,H+4*s))); gb.style.display=g>H+3*s?'none':'';
      if(g>H+3*s) off+=`<text x="${11*s}" y="${-6*s}" font-size="${2.6*s}" text-anchor="middle" fill="#2F7AB0" font-weight="700">no gravity ↑</text>`; }
    svg.querySelector('.off').innerHTML=off;
    svg.querySelector('.splat').textContent=(t>=tEnd-1e-9&&f(tEnd)<=1)?'💥':'';
  };
  self.set(0); return self;
}
function runSim(scene,speed,onT,onEnd){
  stopSim(); const s={raf:0,last:performance.now()}; sim=s;
  if(scene.t>=scene.tEnd-1e-9) scene.set(0);
  const loop=now=>{ if(sim!==s) return; const dt=(now-s.last)/1000; s.last=now; const t=Math.min(scene.tEnd,scene.t+dt*speed); scene.set(t); onT&&onT(t);
    if(t>=scene.tEnd){ sim=null; onEnd&&onEnd(); return; } s.raf=requestAnimationFrame(loop); };
  s.raf=requestAnimationFrame(loop);
}

    <select id="${id}Spd" aria-label="Speed">${[[1,'Real speed'],[2,'2× speed'],[4,'4× speed']].map(([v,l])=>`<option value="${v}" ${v===def?'selected':''}>${l}</option>`).join('')}</select>

/* ---------- graph ---------- */
let gid=0;
function Graph(container,{xMin=0,xMax,yMin=0,yMax,xStep=1,yStep,xl='Time (seconds)',yl}){
  const W=580,H=380,x0=72,x1=560,y0=328,y1=18, id='g'+(++gid);
  const X=t=>x0+(t-xMin)/(xMax-xMin)*(x1-x0), Y=v=>y0-(v-yMin)/(yMax-yMin)*(y0-y1);
  let ax='';
  for(let t=Math.ceil(xMin/xStep)*xStep;t<=xMax+1e-9;t+=xStep) ax+=`<line class="gl" x1="${X(t)}" x2="${X(t)}" y1="${y1}" y2="${y0}"/><text class="tk" x="${X(t)}" y="${y0+18}" text-anchor="middle">${fmt(t)}</text>`;
  for(let v=Math.ceil(yMin/yStep)*yStep;v<=yMax+1e-9;v+=yStep) ax+=`<line class="gl" x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tk" x="${x0-8}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  const zx=xMin<=0&&xMax>=0?X(0):x0, zy=yMin<=0&&yMax>=0?Y(0):y0;
  container.innerHTML=`<svg class="graph" viewBox="0 0 ${W} ${H}"><defs><clipPath id="${id}c"><rect x="${x0}" y="${y1-4}" width="${x1-x0+4}" height="${y0-y1+8}"/></clipPath></defs>${ax}
    <line class="axis" x1="${x0}" x2="${x1}" y1="${zy}" y2="${zy}"/><line class="axis" x1="${zx}" x2="${zx}" y1="${y0}" y2="${y1}"/>
    <text class="axt" x="${(x0+x1)/2}" y="${H-6}" text-anchor="middle">${xl}</text><text class="axt" transform="translate(14 ${(y0+y1)/2}) rotate(-90)" text-anchor="middle">${yl}</text>
    <g class="ref" clip-path="url(#${id}c)"></g><g class="curves" clip-path="url(#${id}c)"></g><g class="pts"></g><g class="labs"></g></svg>`;
  const svg=container.querySelector('svg');
  return {X,Y,xMin,xMax,yMin,yMax,x0,x1,y0,y1,layer:n=>svg.querySelector('.'+n),
    path:(f,a=xMin,b=xMax,n=200)=>{let d='',pen=false;const span=yMax-yMin;for(let i=0;i<=n;i++){const t=a+(b-a)*i/n,v=f(t);if(!isFinite(v)||v>yMax+span||v<yMin-span){pen=false;continue;}d+=(pen?'L':'M')+X(t).toFixed(1)+' '+Y(v).toFixed(1);pen=true;}return d;}};
}
function hTable(rows){ // rows: [{label, cells:[html], cls}]

/* ---------- shared form helpers ---------- */
function parseExpr(src){
  let s=String(src||'').toLowerCase().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[×·•∙]/g,'*').replace(/²/g,'^2').replace(/÷/g,'/');
  s=s.replace(/^[a-z](\([a-z]\))?=/,'');
  if(!s) throw new Error('empty');
  const toks=[];let i=0;
  while(i<s.length){const c=s[i];
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const v=parseFloat(s.slice(i,j));if(isNaN(v))throw 0;toks.push({t:'n',v});i=j;continue;}
    if(c==='t'||c==='x'){toks.push({t:'v'});i++;continue;}
    if('+-*/^()'.includes(c)){toks.push({t:c});i++;continue;}
    throw new Error('char');}
  const out=[];toks.forEach((b,k)=>{const a=toks[k-1];if(a&&(a.t==='n'||a.t==='v'||a.t===')')&&(b.t==='n'||b.t==='v'||b.t==='('))out.push({t:'*'});out.push(b);});
  let p=0;const peek=()=>out[p],eat=t=>{if(out[p]&&out[p].t===t){p++;return true;}return false;};
  function expr(){let f=term();while(peek()&&(peek().t==='+'||peek().t==='-')){const op=out[p++].t,g=term(),F=f;f=op==='+'?(x=>F(x)+g(x)):(x=>F(x)-g(x));}return f;}
  function term(){let f=unary();while(peek()&&(peek().t==='*'||peek().t==='/')){const op=out[p++].t,g=unary(),F=f;f=op==='*'?(x=>F(x)*g(x)):(x=>F(x)/g(x));}return f;}
  function unary(){if(eat('-')){const g=unary();return x=>-g(x);}if(eat('+'))return unary();return power();}
  function power(){const b=atom();if(eat('^')){const e=unary();return x=>Math.pow(b(x),e(x));}return b;}
  function atom(){const t=out[p++];if(!t)throw 0;if(t.t==='n')return()=>t.v;if(t.t==='v')return x=>x;if(t.t==='('){const f=expr();if(!eat(')'))throw 0;return f;}throw 0;}
  const f=expr();if(p!==out.length)throw 0;
  return {f,hasVar:toks.some(t=>t.t==='v')};
}
const tryParse=t=>{try{return parseExpr(t);}catch(e){return null;}};
const TESTS=[0.5,1,2,3.3,5,7.5];
const equiv=(f,g)=>TESTS.every(x=>{const a=f(x),b=g(x);return isFinite(a)&&Math.abs(a-b)<1e-6*(1+Math.abs(b));});
const pretty=t=>esc(String(t||'').trim().replace(/^[a-zA-Z](\([a-zA-Z]\))?\s*=\s*/,'')).replace(/\*/g,' · ').replace(/\^2/g,'²').replace(/-/g,' − ').replace(/\+/g,' + ').replace(/\s+/g,' ').replace(/\(\s/g,'(').replace(/\s\)/g,')').trim();

const ng1=t=>10+406*t;
let sc1=null,g1=null;
function buildS1(){
  $('#stage').innerHTML=`<section>
    <div class="intro"><span class="tag">Stage 1 · Warm-up</span><h2>Sky bound</h2>
    <p>A cannon is <b>10 feet</b> off the ground. It launches a cannonball <b>straight up</b> at <b>406 feet per second</b>. Imagine there is <b>no gravity</b>, so the cannonball keeps going up at the same speed.</p></div>
    <div class="split">${vizCard('v1','<div class="t2" id="t1"></div>')}<div class="card panel" id="p1"></div></div></section>`;
  sc1=CannonScene($('#v1S'),{H:2200,h0:10,f:ng1,tEnd:5});
  g1=Graph($('#v1G'),{xMax:5,yMax:2200,yStep:500,yl:'Height (ft)'});
  const s=state.s1;
  const upd=t=>{$('#v1Out').textContent=`t = ${fmt(t,1)} s · ${fmt(ng1(t),0)} ft`;draw1(t);};
  $('#v1Spd').value='1';
  $('#v1Go').onclick=()=>runSim(sc1,+$('#v1Spd').value,upd,()=>{if(!s.fired){s.fired=true;persist();upd1(false);}});
  $('#v1Reset').onclick=()=>{stopSim();sc1.set(0);upd(0);};
  if(s.fired){sc1.set(5);draw1(5);} else draw1(0);
  upd1(false);
}
function draw1(t){
  const s=state.s1,g=g1; if(!g) return;
  g.layer('curves').innerHTML=t>0?`<path class="cv b" d="${g.path(ng1,0,t)}"/>`:'';
  let pts=''; if(s.tblOk) for(let k=0;k<=5;k++) pts+=`<circle class="pt b" cx="${g.X(k)}" cy="${g.Y(ng1(k))}" r="5.5"/>`;

    ${choiceRow('mile',[{id:'yes',label:'Yes'},{id:'no',label:'No'}],s.mile,'yes')}
    ${fbChoice(s.mile,'yes',{yes:'✓ It reaches about <b>10,050 ft</b>, almost 2 miles! The top is at t = 800 ÷ 32 = 25 s.',no:'Slide to 800 and look at the max height.'})}</div>`;
    if(s.mile==='yes') h+=nextBtn(4,'Next: Domain detective →','to4'); }
  P.innerHTML=h;
  const cM=$('#cM3'); if(cM) cM.onclick=()=>{s.match=s.match||{};let all=true;$$('[data-m]').forEach(sel=>{s.match[sel.dataset.m]=sel.value;const ok=sel.value===ANS3[sel.dataset.m];mark(sel,ok);if(!ok)all=false;});
    persist(); if(all){s.matchOk=true;s.layers={a:true,b:true};persist();draw3(0);upd3(true);} else fbSet('fbM3','no','Not quite. Hint: which term has no t in it? Which one is negative?');};
  const lk=$('#lock3'); if(lk) lk.onclick=()=>{const H=num($('#estH').value),T=num($('#estT').value);
    if(!isFinite(H)||!isFinite(T)) return fbSet('fbEst','no','Enter both a height and a time.');
    s.estH=String(H);s.estT=String(T);s.estDone=true;persist();pushMe();upd3(false);draw3(0);};
  const cL=$('#cL3'); if(cL) cL.onclick=()=>{const el=$('#land'),v=num(el.value);s.land=el.value;
    if(v>=19.6&&v<=19.8){s.landOk=true;persist();upd3(true);return;} mark(el,false);persist();
    fbSet('fbL3','no',v===19.5?'That\'s double 9.75, but the ball started 50 ft up, so it takes a little longer to come down.':v>=19&&v<=20.4?'Close! Zoom in. Find where the curve crosses the horizontal axis, to the nearest tenth.':'Find where the orange curve hits the ground (height = 0).');};
  $$('[data-c="dom3"]').forEach(b=>b.onclick=()=>{s.dom=b.dataset.v;persist();draw3(sc3?sc3.t:T3);upd3(s.dom==='land');});
  $$('[data-c="rng3"]').forEach(b=>b.onclick=()=>{s.rng=b.dataset.v;persist();upd3(s.rng==='0max');});
  const vs=$('#vs'); if(vs) vs.oninput=e=>{s.v=+e.target.value;persist();const v=s.v,mx=50+v*v/64;$('#vv').textContent=v;$('#veq').textContent=`d = 50 + ${v}t − 16t²`;$('#vmx').textContent=fmt(mx,0)+' ft';$('#vmi').textContent=fmt(mx/5280,2)+' miles';};
  $$('[data-c="mile"]').forEach(b=>b.onclick=()=>{s.mile=b.dataset.v;persist();upd3(s.mile==='yes');});
  const n=$('#to4'); if(n) n.onclick=()=>go(4);
  if(scroll) scrollLast(P);
}

/* =====================================================================
   STAGE 4: Domain detective
   ===================================================================== */
const CARDS=[
  {id:'garden',icon:'🌱',title:"Noah's garden",desc:'The area A of a rectangular garden with <b>50 m</b> of fence and length L meters.',eq:'A(L) = L(25 − L)',f:L=>L*(25-L),
   win:{xMin:-5,xMax:30,xStep:5,yMin:-160,yMax:200,yStep:40,xl:'Length L (m)',yl:'Area (m²)'},dom:[0,25],vtx:[12.5,156.25],zeros:[0,25],
   qs:[{k:'dom',q:'What domain makes sense?',opts:['All real numbers','L ≥ 0','0 ≤ L ≤ 25','0 ≤ L ≤ 50'],ans:2,ok:'A length can\'t be negative, and since L + W = 25, the length can be at most 25 m.',no:'Can a length be negative? And how long can one side be if L + W = 25?'},
       {k:'ver',q:'The vertex is (12.5, 156.25). What does it mean?',opts:['The biggest garden: 12.5 m × 12.5 m gives 156.25 m²','The garden is 156.25 m long','It uses 12.5 m of fence'],ans:0,ok:'The square garden gives the maximum area.',no:'The vertex is the highest point. What is the largest output here?'},
       {k:'zer',q:'The zeros are L = 0 and L = 25. What do they mean?',opts:['No garden at all: one side would be 0 m','The garden has the largest area','The fence is 25 m long'],ans:0,ok:'With L = 0 or L = 25 (so W = 0), the area is 0.',no:'A zero is where the output (area) is 0.'}]},
  {id:'fall',icon:'🪨',title:'Distance fallen',desc:'The distance g in feet an object has fallen t seconds after being dropped from a <b>576-ft</b> building.',eq:'g(t) = 16t²',f:t=>16*t*t,
   win:{xMin:-8,xMax:8,xStep:2,yMin:-100,yMax:1100,yStep:200,xl:'Time t (s)',yl:'Distance fallen (ft)'},dom:[0,6],vtx:[0,0],zeros:[0],
   qs:[{k:'dom',q:'What domain makes sense?',opts:['All real numbers','t ≥ 0','0 ≤ t ≤ 6','0 ≤ t ≤ 576'],ans:2,ok:'Time starts at 0, and the object hits the ground at 6 s (16 · 6² = 576).',no:'When does time start? And when does the object hit the ground from 576 ft?'},
       {k:'ver',q:'The vertex is (0, 0). What does it mean?',opts:['The moment it\'s dropped: it hasn\'t fallen yet','The highest point it reaches','When it hits the ground'],ans:0,ok:'At t = 0 it has fallen 0 feet.',no:'What is happening at t = 0?'},
       {k:'zer',q:'The only zero is t = 0. What does it mean?',opts:['At the start, it has fallen 0 feet','It hits the ground','It stops falling'],ans:0,ok:'The distance fallen is 0 only at the very start.',no:'A zero is where the output (distance fallen) is 0.'}]},
  {id:'height',icon:'🏢',title:'Height above ground',desc:'The height h in feet of an object t seconds after being dropped from <b>576 ft</b>.',eq:'h(t) = 576 − 16t²',f:t=>576-16*t*t,
   win:{xMin:-8,xMax:8,xStep:2,yMin:-500,yMax:700,yStep:200,xl:'Time t (s)',yl:'Height (ft)'},dom:[0,6],vtx:[0,576],zeros:[-6,6],
   qs:[{k:'dom',q:'What domain makes sense?',opts:['All real numbers','t ≥ 0','0 ≤ t ≤ 6','−6 ≤ t ≤ 6'],ans:2,ok:'From the drop (t = 0) until it hits the ground (t = 6).',no:'Negative time is before the drop. What happens after 6 seconds?'},
       {k:'ver',q:'The vertex is (0, 576). What does it mean?',opts:['Its starting height, the moment it\'s dropped','Its top speed','When it lands'],ans:0,ok:'The highest point is where it starts: 576 ft.',no:'What is the height at t = 0?'},
       {k:'zer',q:'The zeros are t = −6 and t = 6. Which one makes sense, and what does it mean?',opts:['t = 6: it hits the ground after 6 seconds','t = −6: it hit the ground 6 seconds early','Both: it lands twice'],ans:0,ok:'Only t = 6 is in the domain. That\'s when the height is 0.',no:'Is negative time in our domain?'}]},
  {id:'profit',icon:'💊',title:'Insulin profit',desc:'Profit p, in millions of dollars, from selling v million vials of insulin.',eq:'p(v) = −0.3v² + 150v',f:v=>-0.3*v*v+150*v,
   win:{xMin:-100,xMax:600,xStep:100,yMin:-20000,yMax:22000,yStep:5000,xl:'Vials sold v (millions)',yl:'Profit ($ millions)'},dom:[0,500],vtx:[250,18750],zeros:[0,500],
   qs:[{k:'dom',q:'For what values of v is the profit positive (p(v) > 0)?',opts:['0 < v < 500','0 < v < 250','v > 250','v > 500'],ans:0,ok:'Between 0 and 500 million vials, the graph is above the axis, so the company makes a profit.',no:'Positive means <b>above</b> the horizontal axis, not going up.'},
       {k:'ver',q:'The vertex is (250, 18,750). What does it mean?',opts:['Selling 250 million vials gives the maximum profit: $18,750 million','The company sells 18,750 million vials','The profit is $250 million'],ans:0,ok:'That\'s about $18.75 billion, the most the company can make.',no:'Which number is vials and which is profit?'},
       {k:'zer',q:'The zeros are v = 0 and v = 500. What do they mean?',opts:['Break-even: no profit and no loss','The most profit','The company stops selling'],ans:0,ok:'At 0 and 500 million vials, profit is exactly 0.',no:'A zero is where the output (profit) is 0.'}]}
];
let g4=null;
function buildS4(){
  const s=state.s4, cur=s.card||0;
  const doneCard=c=>CARDS[c].qs.every(q=>(s.a[CARDS[c].id+q.k])===q.ans);
  $('#stage').innerHTML=`<section>
    <div class="intro"><span class="tag">Stage 4</span><h2>Domain detective</h2>
    <p>Graphing technology shows the <b>whole</b> parabola, but a situation only uses part of it. For each function, find the domain that makes sense, then explain what the <b>vertex</b> and <b>zeros</b> mean.</p></div>
    <div class="cardtabs">${CARDS.map((c,i)=>`<button class="ctab ${i===cur?'on':''}" data-card="${i}">${c.icon} ${c.title}${doneCard(i)?' <span class="ck">✓</span>':''}</button>`).join('')}</div>
    <div class="split"><div class="card sticky"><div class="fhead"><div><b>${CARDS[cur].title}</b><div class="small">${CARDS[cur].desc}</div></div><div class="eq feq">${CARDS[cur].eq}</div></div><div id="g4"></div><div class="gnote" id="n4"></div></div>
    <div class="card panel" id="p4"></div></div></section>`;
  $$('[data-card]').forEach(b=>b.onclick=()=>{s.card=+b.dataset.card;persist();buildS4();});
  g4=Graph($('#g4'),CARDS[cur].win);
  upd4(false);
}
function draw4(){
  const s=state.s4, C=CARDS[s.card||0], g=g4, a=k=>s.a[C.id+k]===C.qs.find(q=>q.k===k).ans;
  let c='', p='', l='';
  if(a('dom')){ const [d0,d1]=C.dom;
    if(C.id==='profit') c+=`<rect x="${g.X(0)}" y="${g.y1}" width="${g.X(500)-g.X(0)}" height="${g.Y(0)-g.y1}" fill="rgba(30,158,90,.08)"/>`;
    c+=`<path class="cv o" style="opacity:.18" d="${g.path(C.f)}"/><path class="cv o" d="${g.path(C.f,d0,d1)}"/>`;
    if(C.id==='profit') c+=`<path class="cv o" style="opacity:.55;stroke-dasharray:6 6" d="${g.path(C.f,500,600)}"/>`;
  } else c+=`<path class="cv o" d="${g.path(C.f)}"/>`;
  if(a('ver')){ p+=`<circle class="pt b" cx="${g.X(C.vtx[0])}" cy="${g.Y(C.vtx[1])}" r="7"/>`; l+=`<text class="glab" x="${g.X(C.vtx[0])}" y="${g.Y(C.vtx[1])-13}" text-anchor="middle" fill="#2F7AB0">vertex (${fmt(C.vtx[0])}, ${fmt(C.vtx[1])})</text>`; }
  if(a('zer')) C.zeros.forEach(z=>{const inD=z>=C.dom[0]-1e-9&&z<=C.dom[1]+1e-9; p+=`<circle class="pt ${inD?'g':'x'}" cx="${g.X(z)}" cy="${g.Y(0)}" r="7" style="${inD?'':'opacity:.45'}"/>`; });
  g.layer('curves').innerHTML=c; g.layer('pts').innerHTML=p; g.layer('labs').innerHTML=l;
  $('#n4').innerHTML=a('dom')?`<span class="lg"><i style="background:var(--orange)"></i>${C.id==='profit'?'Profit (solid where p(v) > 0)':'Part that makes sense'}</span><span class="lg"><i style="background:var(--orange);opacity:.25"></i>Doesn't fit the situation</span>${C.id==='profit'?'<span class="lg"><i style="background:var(--orange);opacity:.55"></i>Dashed: loses money (p(v) < 0)</span>':''}`:'<span class="lg"><i style="background:var(--orange)"></i>The whole parabola</span>';
}
function upd4(scroll){
  const s=state.s4, C=CARDS[s.card||0], P=$('#p4');
  draw4();
  let h='', prevOk=true;
  C.qs.forEach((q,i)=>{ if(!prevOk) return; const key=C.id+q.k, picked=s.a[key], ok=picked===q.ans;
    h+=`<div class="qstep ${ok?'doneStep':''}">${head(i+1,q.k==='dom'?(C.id==='profit'?'Where is it positive?':'Domain'):q.k==='ver'?'Vertex':'Zeros',ok)}<p>${q.q}</p>
      <div class="choices">${q.opts.map((o,j)=>`<button class="choice ${picked===j?(ok?'ok':'no'):''}" data-q="${key}" data-j="${j}" ${ok?'disabled':''}>${o}</button>`).join('')}</div>
      ${picked!=null?`<div class="fb ${ok?'ok':'no'}">${ok?'✓ '+q.ok:q.no}</div>`:''}</div>`;
    prevOk=ok; });
  const allDone=CARDS.every(c=>c.qs.every(q=>s.a[c.id+q.k]===q.ans));
  const thisDone=C.qs.every(q=>s.a[C.id+q.k]===q.ans);
  if(thisDone&&!allDone){ const nx=CARDS.findIndex((c,i)=>!c.qs.every(q=>s.a[c.id+q.k]===q.ans)); h+=`<button class="btn primary big" data-card="${nx}">Next: ${CARDS[nx].icon} ${CARDS[nx].title} →</button>`; }
  if(allDone) h+=`<div class="celebrate">🎉 <b>Case closed!</b> The <b>domain</b> depends on the situation, the <b>vertex</b> is the maximum (or the starting point), and the <b>zeros</b> are where the output is 0: no garden, the ground, or break-even.</div>`;
  P.innerHTML=h;
  $$('[data-q]',P).forEach(b=>b.onclick=()=>{s.a[b.dataset.q]=+b.dataset.j;persist();const C2=CARDS[s.card||0];const done=C2.qs.every(q=>s.a[C2.id+q.k]===q.ans);if(done)buildS4();else upd4(true);});
  $$('[data-card]',P).forEach(b=>b.onclick=()=>{s.card=+b.dataset.card;persist();buildS4();window.scrollTo({top:0,behavior:'smooth'});});
  if(scroll) scrollLast(P);
}

(function boot(){
  if(teacherAll) return startSolo();
  const saved=LS.get('cannon:live'), qcode=(params.get('code')||'').toUpperCase(), qname=params.get('name');
  if(qcode&&qname){ showJoin('Joining…'); return joinLive(qcode,qname,!!params.get('demo')); }
  if(saved&&saved.code&&(!qcode||qcode===saved.code)){ showJoin('Reconnecting…'); return joinLive(saved.code,saved.name,!!saved.demo); }
  if(LS.get(KEY)&&!qcode) return startSolo();
  showJoin();
})();
})();

<!-- Calculator boxes: number boxes can do arithmetic (e.g. 100+300 → 400, 16(6)^2 → 576). Equation boxes (.ex) are left alone. -->
<style>
.calcTip{position:fixed;z-index:70;background:#13294B;color:#fff;font:600 .85rem Lexend,system-ui,sans-serif;padding:4px 10px;border-radius:8px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 14px rgba(19,41,75,.25)}
.calcTip b{color:#FFD2B0;font-size:.95rem}
.calcTip small{opacity:.75;font-weight:400;margin-left:6px}
.calcTip::before{content:"";position:absolute;top:-5px;left:14px;border:5px solid transparent;border-top:0;border-bottom-color:#13294B}
</style>
<script>
(function(){
  function evalArith(src){
    let s=String(src||'').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[×·•∙xX*]/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/³/g,'^3').replace(/,(?=\d{3}(\D|$))/g,'');
    if(!s||!/^[0-9.+\-*/^()√]+$/.test(s)) return null;
    if(/^-?\d*\.?\d+$/.test(s)) return null;               // already just a number
    const t=[];let i=0;
    while(i<s.length){const c=s[i];
      if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const v=parseFloat(s.slice(i,j));if(isNaN(v)||(s.slice(i,j).split('.').length>2))return null;t.push({k:'n',v});i=j;continue;}
      t.push({k:c});i++;}
    const o=[];t.forEach((b,k)=>{const a=t[k-1];if(a&&(a.k==='n'||a.k===')')&&(b.k==='n'||b.k==='('||b.k==='√'))o.push({k:'*'});o.push(b);});
    let p=0;const pk=()=>o[p],eat=k=>{if(o[p]&&o[p].k===k){p++;return true;}return false;};
    function E(){let v=T();while(pk()&&(pk().k==='+'||pk().k==='-')){const op=o[p++].k,w=T();v=op==='+'?v+w:v-w;}return v;}
    function T(){let v=U();while(pk()&&(pk().k==='*'||pk().k==='/')){const op=o[p++].k,w=U();v=op==='*'?v*w:v/w;}return v;}
    function U(){if(eat('-'))return -U();if(eat('+'))return U();if(eat('√'))return Math.sqrt(U());return P();}
    function P(){const b=A();if(eat('^'))return Math.pow(b,U());return b;}
    function A(){const x=o[p++];if(!x)throw 0;if(x.k==='n')return x.v;if(x.k==='('){const v=E();if(!eat(')'))throw 0;return v;}throw 0;}
    try{const v=E();if(p!==o.length||!isFinite(v))return null;return Math.round(v*1e6)/1e6;}catch(e){return null;}
  }
  const isCalcBox=el=>el&&el.tagName==='INPUT'&&!el.readOnly&&!el.classList.contains('ex')&&/^(decimal|numeric)$/.test(el.getAttribute('inputmode')||'');
  const tip=document.createElement('div');tip.className='calcTip';tip.hidden=true;document.body.appendChild(tip);
  let cur=null;
  function show(el){
    const v=evalArith(el.value);
    if(v==null){tip.hidden=true;return;}
    tip.innerHTML=`= <b>${String(v)}</b><small>press Enter</small>`;
    const r=el.getBoundingClientRect();tip.style.left=Math.max(4,r.left)+'px';tip.style.top=(r.bottom+6)+'px';tip.hidden=false;
  }
  function commit(el){
    const v=evalArith(el.value); tip.hidden=true;
    if(v==null) return false;
    el.value=String(v); el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true}));
    return true;
  }
  document.addEventListener('input',e=>{ if(isCalcBox(e.target)){cur=e.target;show(e.target);} },true);
  document.addEventListener('focusin',e=>{ if(isCalcBox(e.target)){cur=e.target;show(e.target);} });
  document.addEventListener('focusout',e=>{ if(isCalcBox(e.target)){commit(e.target);cur=null;} });
  document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&isCalcBox(e.target)&&evalArith(e.target.value)!=null){ e.preventDefault(); e.stopPropagation(); commit(e.target); show(e.target); } },true);
  // Clicking Check counts too: convert before the click handler reads the box
  document.addEventListener('pointerdown',e=>{ if(cur&&e.target!==cur) commit(cur); },true);
  window.addEventListener('scroll',()=>{ if(cur&&!tip.hidden) show(cur); },true);
  window.addEventListener('resize',()=>{ if(cur&&!tip.hidden) show(cur); });
})();
</script>

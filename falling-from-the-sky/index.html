.txt{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border:2px solid var(--line);border-radius:12px}
.txt:focus{outline:none;border-color:var(--blue)}
.code-in{text-transform:uppercase;letter-spacing:.3em;font-weight:800;font-size:1.6rem;text-align:center}

<script>
(function(){
const KEY='fallingSky.v1', APP='falling-sky';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=2)=>{const p=Math.pow(10,d),r=Math.round(n*p)/p;return (Object.is(r,-0)?0:r).toLocaleString('en-US',{maximumFractionDigits:d});};
const num=v=>parseFloat(String(v).replace(/[−–—]/g,'-').replace(/[,\s]/g,''));

  s1:{done:false,same:null,showDiff:false},
  s2:{p6:'',p6First:'',p6Ok:false,p6Tries:0,eqTries:[],trap:null,div:{},divOk:false,sq:null,p7:'',p7Ok:false,eq:'',eqOk:false},

};}
function merge(d){ const b=defaults(); if(!d||!d.s1) return b;
  return {...b,...d,s1:{...b.s1,...d.s1},s2:{...b.s2,...d.s2,div:(d.s2&&d.s2.div)||{},eqTries:(d.s2&&d.s2.eqTries)||[]},s3:{...b.s3,...d.s3},s4:{...b.s4,...d.s4,tbl:(d.s4&&d.s4.tbl)||{},hTries:(d.s4&&d.s4.hTries)||[],cd2Tries:(d.s4&&d.s4.cd2Tries)||[]}}; }
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
const params=new URLSearchParams(location.search), teacherAll=params.has('teacher');
let state=defaults();
let LIVE=null, CLS={stage:1,freeze:false}, unsubs=[], firstState=true, heartbeat=null, syncT=null;

  else LS.set(KEY,state);
}

function cleanup(){ unsubs.forEach(u=>u()); unsubs=[]; if(heartbeat) clearInterval(heartbeat); heartbeat=null; stopSim(); }
function renderHeader(){

function runSim(scene,speed,onT,onEnd){
  stopSim();

}

function Graph(container,{tMax,yMax,tStep=1,yStep,xl='Time (seconds)',yl}){
  const W=580,H=380,x0=68,x1=560,y0=328,y1=18;
  const X=t=>x0+t/tMax*(x1-x0), Y=v=>y0-v/yMax*(y0-y1);

  for(let v=0;v<=yMax+1e-9;v+=yStep) ax+=`<line class="gl" x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tk" x="${x0-8}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  container.innerHTML=`<svg class="graph" viewBox="0 0 ${W} ${H}"><defs><clipPath id="gc${container.id}"><rect x="${x0}" y="${y1-4}" width="${x1-x0+4}" height="${y0-y1+4}"/></clipPath></defs>${ax}
    <line class="axis" x1="${x0}" x2="${x1}" y1="${y0}" y2="${y0}"/><line class="axis" x1="${x0}" x2="${x0}" y1="${y0}" y2="${y1}"/>
    <text class="axt" x="${(x0+x1)/2}" y="${H-6}" text-anchor="middle">${xl}</text><text class="axt" transform="translate(16 ${(y0+y1)/2}) rotate(-90)" text-anchor="middle">${yl}</text>
    <g class="ref"></g><g class="curves" clip-path="url(#gc${container.id})"></g><g class="pts"></g><g class="labs"></g></svg>`;
  const svg=container.querySelector('svg');
  const g={X,Y,tMax,yMax,
    layer:n=>svg.querySelector('.'+n),
    path:(f,a=0,b=tMax,stepN=160)=>{let d='',pen=false;for(let i=0;i<=stepN;i++){const t=a+(b-a)*i/stepN,v=f(t);if(!isFinite(v)||v>yMax*3||v<-yMax){pen=false;continue;}d+=(pen?'L':'M')+X(t).toFixed(1)+' '+Y(v).toFixed(1);pen=true;}return d;}};
  return g;
}

/* ---------- expression parser ---------- */
function parseExpr(src){
  let s=String(src||'').toLowerCase().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[×·•∙]/g,'*').replace(/²/g,'^2').replace(/÷/g,'/');
  s=s.replace(/^[a-z](\([a-z]\))?=/,'');
  if(!s) throw new Error('empty');
  const toks=[];let i=0;
  while(i<s.length){const c=s[i];
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const v=parseFloat(s.slice(i,j));if(isNaN(v))throw 0;toks.push({t:'n',v});i=j;continue;}
    if(c==='t'||c==='x'){toks.push({t:'v'});i++;continue;}
    if('+-*/^()'.includes(c)){toks.push({t:c});i++;continue;}
    throw new Error('char');}
  const out=[];toks.forEach((b,k)=>{const a=toks[k-1];if(a&&(a.t==='n'||a.t==='v'||a.t===')')&&(b.t==='n'||b.t==='v'||b.t==='('))out.push({t:'*'});out.push(b);});
  let p=0;const peek=()=>out[p],eat=t=>{if(out[p]&&out[p].t===t){p++;return true;}return false;};
  function expr(){let f=term();while(peek()&&(peek().t==='+'||peek().t==='-')){const op=out[p++].t,g=term(),F=f;f=op==='+'?(x=>F(x)+g(x)):(x=>F(x)-g(x));}return f;}
  function term(){let f=unary();while(peek()&&(peek().t==='*'||peek().t==='/')){const op=out[p++].t,g=unary(),F=f;f=op==='*'?(x=>F(x)*g(x)):(x=>F(x)/g(x));}return f;}
  function unary(){if(eat('-')){const g=unary();return x=>-g(x);}if(eat('+'))return unary();return power();}
  function power(){const b=atom();if(eat('^')){const e=unary();return x=>Math.pow(b(x),e(x));}return b;}
  function atom(){const t=out[p++];if(!t)throw 0;if(t.t==='n')return()=>t.v;if(t.t==='v')return x=>x;if(t.t==='('){const f=expr();if(!eat(')'))throw 0;return f;}throw 0;}
  const f=expr();if(p!==out.length)throw 0;
  return {f,hasVar:toks.some(t=>t.t==='v')};
}
const tryParse=t=>{try{return parseExpr(t);}catch(e){return null;}};
const TESTS=[0.5,1,2,3.3,5,7.5];

  const cT=$('#cT'); if(cT) cT.onclick=()=>{let all=true,flip=false;$$('[data-h]').forEach(i=>{const t=+i.dataset.h,v=num(i.value),ok=v===hgt(t);if(v===d16(t))flip=true;mark(i,ok);if(!ok)all=false;});
    if(all){s.tblOk=true;persist();upd4(true);}else fbSet('fbT','no',flip?'Those are Elena\'s numbers. Diego measures how high the object is <b>above the ground</b>. Start at 576 and subtract how far it has fallen.':'Height above ground = 576 − distance fallen.');};
  const cH=$('#cH'); if(cH) cH.onclick=()=>{const el=$('#eH'),t=el.value.trim();s.hTry=t;if(t)pushTry(s.hTries,t);const pr=tryParse(t);
    if(pr&&pr.hasVar&&equiv(pr.f,hgt)){s.h=t;s.hOk=true;persist();upd4(true);return;} mark(el,false);persist();
    let m='I can\'t read that. Use t for time.';
    if(pr&&!pr.hasVar) m='Your equation needs <b>t</b> in it.';
    else if(pr&&equiv(pr.f,t=>16*t*t-576)) m='Flipped! At t = 0 the height should be 576, not −576.';
    else if(pr&&equiv(pr.f,t=>576-16*t)) m='Close! The distance fallen is 16t², not 16t.';
    else if(pr&&equiv(pr.f,d16)) m='That\'s Elena\'s distance fallen. Diego wants the height above the ground.';
    else if(pr) m=`Test it: when t = 2, your equation gives ${fmt(pr.f(2))}, but the height should be 512 ft.`;
    fbSet('fbH','no',m);};
  const cG=$('#cG'); if(cG) cG.onclick=()=>{const el=$('#gd'),v=num(el.value);s.gnd=el.value;
    if(v===6){s.gndOk=true;persist();upd4(true);return;} mark(el,false);persist();
    fbSet('fbG','no',v===36?'36 is t². What number times itself is 36?':'Not quite. Try the hint.');};
  const hG=$('#hG'); if(hG) hG.onclick=()=>fbSet('fbG','tip','Hint: it hits the ground when the height is 0, so 16t² = 576. Divide by 16, then think: what number squared gives that?');
  $$('[data-c="path"]').forEach(b=>b.onclick=()=>{s.path=b.dataset.v;persist();upd4(s.path==='no');});
  const c1=$('#cC1'); if(c1) c1.onclick=()=>{const el=$('#cd1'),v=num(el.value);s.cd1=el.value;
    if(v===842){s.cd1Ok=true;persist();upd4(true);return;} mark(el,false);persist();
    fbSet('fbC1','no',v===64?'64 ft is how far it has <b>fallen</b>. What\'s its height?':v===874?'Remember to square the time: 16 × 2² = 64, not 32.':'Start at 906 and subtract the distance fallen in 2 seconds.');};
  const c2=$('#cC2'); if(c2) c2.onclick=()=>{const el=$('#eC2'),t=el.value.trim();s.cd2Try=t;if(t)pushTry(s.cd2Tries,t);const pr=tryParse(t);
    if(pr&&pr.hasVar&&equiv(pr.f,x=>906-16*x*x)){s.cd2=t;s.cd2Ok=true;persist();upd4(true);return;} mark(el,false);persist();
    fbSet('fbC2','no',pr&&equiv(pr.f,hgt)?'That\'s for the 576-foot drop. This one starts at 906 ft.':pr&&pr.hasVar?`Test it: when t = 2, your function gives ${fmt(pr.f(2))}, but the height is 842 ft.`:'Use t for time, like Diego\'s equation.');};
  if(scroll){const st=$$('.qstep',P),last=st[st.length-1];if(last){last.classList.add('fresh');last.scrollIntoView({behavior:'smooth',block:'nearest'});const inp=last.querySelector('input:not([readonly])');if(inp)setTimeout(()=>inp.focus({preventScroll:true}),300);}}
}

(function boot(){
  if(teacherAll) return startSolo();
  const saved=LS.get('fallingSky:live'), qcode=(params.get('code')||'').toUpperCase(), qname=params.get('name');
  if(qcode&&qname){ showJoin('Joining…'); return joinLive(qcode,qname,!!params.get('demo')); }
  if(saved&&saved.code&&(!qcode||qcode===saved.code)){ showJoin('Reconnecting…'); return joinLive(saved.code,saved.name,!!saved.demo); }
  if(LS.get(KEY)&&!qcode) return startSolo();
  showJoin();
})();
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson 1: Noah's Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#4B9CD3; --blue-d:#2F7AB0; --navy:#13294B; --orange:#F56600; --orange-l:#FFE3CF;
  --green:#8CCB6E; --bg:#F4F8FC; --card:#fff; --ink:#1B2433; --muted:#5B6678; --line:#DCE5EF;
  --good:#1E9E5A; --bad:#D64545;
}
*{box-sizing:border-box}
body{margin:0;font-family:Lexend,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff}
.hwrap{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--orange);display:grid;place-items:center;font-size:24px}
.brand h1{margin:0;font-size:1.35rem}
.brand p{margin:0;font-size:.85rem;color:#BFD8EE}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reset{background:transparent;border:1px solid #4A6488;color:#DCE8F5;border-radius:10px;padding:8px 12px;font:inherit;font-size:.85rem;cursor:pointer;text-decoration:none}
.reset:hover{background:#1F3A63}
.who{background:#1F3A63;border-radius:10px;padding:7px 12px;font-size:.85rem;color:#DCE8F5}
.who b{color:#fff}
nav#steps{max-width:1180px;margin:0 auto;padding:0 20px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
nav#steps:empty{display:none}
.step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:0;background:#1F3A63;color:#fff;font:inherit;text-align:left;cursor:pointer}
.step .num{width:30px;height:30px;border-radius:50%;background:#2E4E7D;display:grid;place-items:center;font-weight:700;flex:none;font-size:.9rem}
.step b{font-size:.9rem;display:block}
.step small{display:block;color:#A9C3DD;font-size:.72rem}
.step.cur{background:var(--blue)} .step.cur .num{background:#fff;color:var(--blue-d)} .step.cur small{color:#EAF4FC}
.step.done .num{background:var(--good)}
.step.locked{opacity:.5;cursor:not-allowed}
main{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:0 16px 24px}
footer a{color:var(--muted)}
.intro{margin-bottom:16px}
.tag{display:inline-block;background:var(--orange-l);color:#B44A00;font-weight:700;font-size:.75rem;padding:4px 10px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase}
.intro h2{margin:8px 0 6px;font-size:1.6rem;color:var(--navy)}
.intro p{margin:0;max-width:840px;line-height:1.55;color:#33405A}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.split.wideL{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media(max-width:860px){.split,.split.wideL{grid-template-columns:1fr} nav#steps{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(19,41,75,.06),0 6px 24px rgba(19,41,75,.06);border:1px solid var(--line)}
.panel{display:flex;flex-direction:column;gap:14px}
.ph{margin:0;color:var(--navy);font-size:1.1rem}
.panel p{margin:0;line-height:1.5;font-size:.95rem}
.hint{margin:8px 0 0;font-size:.82rem;color:var(--muted);text-align:center}
.sticky{position:sticky;top:12px}
@media(max-width:860px){.sticky{position:static}}

/* join */
.join{max-width:460px;margin:24px auto;display:flex;flex-direction:column;gap:14px}
.join h2{margin:0;color:var(--navy);font-size:1.5rem}
.join label{font-weight:600;font-size:.9rem;color:var(--navy);display:block;margin-bottom:6px}
.txt{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border:2px solid var(--line);border-radius:12px}
.txt:focus{outline:none;border-color:var(--blue)}
.code-in{text-transform:uppercase;letter-spacing:.3em;font-weight:800;font-size:1.6rem;text-align:center}
.err{color:var(--bad);font-weight:600;font-size:.9rem;min-height:1.2em;margin:0}
.linkbtn{background:none;border:0;color:var(--blue-d);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.muted{color:var(--muted);font-size:.9rem;text-align:center;margin:0}
.banner{background:#FFF4EC;border:1px solid #FFD2B0;border-radius:12px;padding:10px 12px;font-size:.88rem;color:#7A3A0B}

/* garden */
svg.garden{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.soil{fill:#F7F2E6}
.gmin{stroke:#DDD3BD;stroke-width:.04}
.gmaj{stroke:#BFB193;stroke-width:.09}
.gnum{font-size:.8px;fill:#8A7E66}
.plot{fill:var(--green);opacity:.85}
.fence{fill:none;stroke:#8B5A2B;stroke-width:.35;stroke-linejoin:round}
.fence.ok{stroke:var(--good)} .fence.over{stroke:var(--bad);stroke-dasharray:.6 .4}
.lab{font-size:.95px;font-weight:700;fill:var(--navy)}
.areaLab{font-weight:800;fill:#fff;paint-order:stroke;stroke:#2F6B24;stroke-width:.14px}
.handle{fill:var(--orange);stroke:#fff;stroke-width:.25;cursor:grab}

/* controls */
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.stepper .row{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#F8FBFE}
.sbtn{width:46px;height:46px;border:0;background:#EAF3FB;color:var(--blue-d);font-size:1.4rem;font-weight:700;cursor:pointer;font-family:inherit}
.sbtn:hover:not(:disabled){background:#D6E8F7}
.sbtn:disabled{opacity:.35;cursor:not-allowed}
.stepper output{flex:1;text-align:center;font-weight:700;font-size:1.15rem}
.stepper output.ro{height:46px;display:grid;place-items:center;color:var(--muted)}
.meter{background:#F8FBFE;border:1px solid var(--line);border-radius:12px;padding:12px}
.meterTop{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:8px}
.bar{height:14px;background:#E5ECF3;border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--blue);border-radius:99px;transition:width .15s}
.fill.ok{background:var(--good)} .fill.over{background:var(--bad)}
.status{font-size:.88rem;margin-top:8px;font-weight:600}
.status.ok{color:var(--good)} .status.over{color:var(--bad)} .status.under{color:var(--blue-d)}
.btn{font:inherit;font-weight:600;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--navy);padding:10px 16px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn.big{padding:14px 18px;font-size:1rem;width:100%}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--blue-d)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.waitbox{background:#EEF5FB;border:1px dashed #A9CBE8;border-radius:12px;padding:14px;text-align:center;color:var(--navy);font-weight:600;font-size:.95rem}
.progress{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.dots{display:flex;gap:6px}.dot{width:14px;height:14px;border-radius:50%;background:#E1E8F0}.dot.on{background:var(--orange)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{background:#EEF5FB;color:var(--navy);font-weight:600;padding:7px 8px;text-align:center;position:sticky;top:0}
.tbl td{padding:6px 8px;text-align:center;border-bottom:1px solid #EEF2F6}
.tbl td.hl{color:var(--orange);font-weight:700}
.tbl tr.best td{background:#FFF1E6;font-weight:700}
.x{border:0;background:none;color:#A0AABB;font-size:1.1rem;cursor:pointer}
.think{background:#F3F8FD;border:1px dashed #A9CBE8;border-radius:14px;padding:14px}
.think h3{margin:0 0 6px;font-size:1rem;color:var(--navy)}
.think p,.think li{font-size:.92rem;line-height:1.5}
.think ul{margin:6px 0 12px;padding-left:20px}
textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0 10px;resize:vertical}
.reveal{background:#FFF4EC;border-left:4px solid var(--orange);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:.93rem;line-height:1.5}

/* phase 2 */
.gwrap{position:relative}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(244,248,252,.8);border-radius:10px;font-weight:700;color:var(--navy);font-size:1.25rem;text-align:center;padding:20px;transition:opacity .25s}
.overlay small{font-weight:400;font-size:.9rem;color:var(--muted)}
.overlay .cd{font-size:5rem;color:var(--orange);line-height:1}
.overlay.hide{opacity:0;pointer-events:none}
.timerRow{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringBg{fill:none;stroke:#E5ECF3;stroke-width:9}
.ringFg{fill:none;stroke:var(--orange);stroke-width:9;stroke-linecap:round;stroke-dasharray:276.46}
.ring.low .ringFg{stroke:var(--bad)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:1.8rem;font-weight:800;color:var(--navy)}
.ring.low span{color:var(--bad)}
.areaBox{flex:1;background:#F2FAEE;border:1px solid #CFE8C3;border-radius:14px;padding:12px 14px}
.areaBox small{color:#4E7A3E;font-weight:600;text-transform:uppercase;font-size:.72rem;letter-spacing:.05em}
#aEq{font-size:1.15rem;font-weight:700;color:#24521A}
#aEq .big{font-size:1.7rem;color:#1D6B12}
.btnRow{display:flex;gap:10px}
.durRow{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
select{font:inherit;padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
.result{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result>div{background:#FFF4EC;border-radius:12px;padding:10px 12px}
.result small{display:block;color:#A2541B;font-size:.75rem;font-weight:600}
.result b{font-size:1.05rem;color:var(--navy)}
.result.pop>div{animation:pop .4s}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:none;opacity:1}}
details.meas summary{cursor:pointer;font-weight:600;color:var(--navy);padding:4px 0}
.scroll{max-height:220px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:10px}

/* graph */
svg.graph{width:100%;height:auto;display:block}
.gl{stroke:#EDF1F6;stroke-width:1}
.axis{stroke:#5B6678;stroke-width:1.5}
.tk{font-size:12px;fill:var(--muted)}
.axt{font-size:13px;font-weight:600;fill:var(--navy)}
.curve{fill:none;stroke:var(--orange);stroke-width:3.5;stroke-linecap:round}
.ucurve{fill:none;stroke-width:3.5;stroke-linecap:round}
.ucurve.no{stroke:var(--bad);stroke-dasharray:8 6}
.ucurve.ok{stroke:var(--orange)}
.mypt{fill:var(--orange);stroke:#fff;stroke-width:2}
.allpt{fill:var(--blue);stroke:#fff;stroke-width:1.5}
.pin{animation:pin .35s both;transform-box:fill-box;transform-origin:center}
@keyframes pin{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.cmpline{stroke:var(--blue-d);stroke-width:2.5;stroke-dasharray:7 6}
.cmplab{font-size:12px;fill:var(--blue-d);font-weight:600}
.guide{stroke:var(--navy);stroke-width:1;stroke-dasharray:4 4;opacity:.6}
.cur{fill:var(--navy);stroke:#fff;stroke-width:2.5}
.curlab{font-size:13px;font-weight:700;fill:var(--navy);paint-order:stroke;stroke:#fff;stroke-width:4px}
.callout{font-size:13px;font-weight:700;fill:#B44A00;paint-order:stroke;stroke:#fff;stroke-width:4px}
.ulab{font-size:16px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px}
.gnote{font-size:.85rem;color:var(--muted);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:11px;height:11px;border-radius:50%;display:inline-block}
.preds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pred{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px;cursor:pointer;font:inherit;font-size:.85rem;font-weight:600;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pred:hover{border-color:var(--blue);background:#F6FAFE}
.pred svg{width:100%;max-width:120px}
.pred path{fill:none;stroke:var(--orange);stroke-width:3.5;stroke-linecap:round}
.pred .ax{stroke:#9AA6B6;stroke-width:1.5}
.chip{background:#EEF5FB;border-radius:10px;padding:8px 12px;font-size:.9rem}
.bigReveal{background:linear-gradient(135deg,#FFF1E6,#FFE0C7);border-radius:14px;padding:14px;animation:pop .4s}
.bigReveal h3{margin:0 0 4px;color:#B44A00;font-size:1.3rem}
.lbl{display:block;font-size:.9rem;margin-bottom:4px}
.slider{width:100%;accent-color:var(--orange)}
.mini{display:flex;gap:14px;align-items:center;margin-top:8px}
.mini svg{width:96px;flex:none}
#miniTxt{font-size:.95rem;line-height:1.5}
.discuss details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.discuss summary{cursor:pointer;font-weight:600;color:var(--navy);font-size:.92rem}
.discuss details p{margin:8px 0 0;font-size:.9rem;color:#33405A}
.toggle{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.toggle input{accent-color:var(--blue);width:18px;height:18px}

/* phase 4 */
.eqStep{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;animation:pop .35s}
.eqStep.doneStep{background:#F7FBF8;border-color:#CDE9D7}
.eqStep h4{margin:0 0 6px;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between}
.eqStep h4 .ck{color:var(--good)}
.eqStep p{margin:4px 0}
.eq{font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:1.3rem;color:var(--navy);margin:6px 0}
.small{font-size:.86rem;color:var(--muted)}
.abc{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.abc label{font-weight:600;font-family:"Cambria Math",Cambria,serif;font-size:1.15rem}
.abc input,.inl{width:64px;font:inherit;font-size:1.05rem;padding:6px 8px;border:2px solid var(--line);border-radius:8px;text-align:center}
input.ok{border-color:var(--good);background:#EAF8F0} input.no{border-color:var(--bad);background:#FDEEEE}
.fb{font-size:.88rem;font-weight:600;margin-top:6px;line-height:1.45} .fb.ok{color:var(--good)} .fb.no{color:var(--bad)} .fb.tip{color:#7A3A0B}
.ptbl{border-collapse:collapse;margin:6px 0;font-size:.95rem;width:100%}
.ptbl th,.ptbl td{border:1px solid var(--line);padding:6px;text-align:center}
.ptbl th{background:#EEF5FB;color:var(--navy);font-weight:600}
.ptbl input{width:100%;max-width:80px;font:inherit;padding:5px;border:2px solid var(--line);border-radius:8px;text-align:center}
.exrow{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.exrow .lhs{font-family:"Cambria Math",Cambria,serif;font-size:1.3rem;font-weight:700;color:var(--navy)}
.ex{flex:1;min-width:150px;font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:1.2rem;padding:8px 10px;border:2px solid var(--line);border-radius:10px}
.ex:focus{outline:none;border-color:var(--blue)}
.ex.ok{border-color:var(--good);background:#EAF8F0} .ex.no{border-color:var(--bad);background:#FDEEEE}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.key{font:inherit;font-family:"Cambria Math",Cambria,serif;font-size:1.05rem;min-width:40px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:#F8FBFE;cursor:pointer;color:var(--navy)}
.key:hover{border-color:var(--blue)}
.preview{font-size:.85rem;color:var(--muted);min-height:1.2em}
.celebrate{background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;border-radius:14px;padding:16px;margin-top:10px;animation:pop .4s;line-height:1.5}
.celebrate b{color:#FFD2B0}
.freeze{position:fixed;inset:0;background:rgba(19,41,75,.94);color:#fff;display:grid;place-items:center;text-align:center;z-index:50;padding:20px}
.freeze div{font-size:2.2rem;font-weight:800}
.freeze small{display:block;font-size:1rem;font-weight:400;color:#BFD8EE;margin-top:8px}
.estRow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.85rem;color:#4E7A3E;font-weight:600;flex-wrap:wrap}
.estRow input{width:90px;font:inherit;font-size:1.05rem;padding:5px 8px;border:2px solid #CFE8C3;border-radius:8px;text-align:center}
.glist{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.glist .gi{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #EEF2F6;font-size:.95rem}
.glist .gi.me{background:#EEF5FB;font-weight:700}.glist .gi.top{background:#FFF1E6}
.glist .gi b{color:var(--navy)}
.gr{fill:rgba(140,203,110,.07);stroke:var(--blue);stroke-width:.18;opacity:.75}
.gr.me{stroke:var(--navy);stroke-width:.32;opacity:1}.gr.top{stroke:var(--orange);stroke-width:.4;opacity:1}
[hidden]{display:none!important}
</style>
</head>

<header>
  <div class="hwrap">
    <div class="brand"><div class="logo">🌱</div><div><h1>Lesson 1: Noah's Garden</h1><p>50 meters of fence · How big can the garden get?</p></div></div>
    <div class="hbtns" id="hbtns"></div>
  </div>
  <nav id="steps"></nav>
</header>
<main id="stage"></main>
<footer>Honors Math 1 · Unit 7 Lesson 1 · A Different Kind of Change · <a href="teacher.html">Teacher dashboard</a></footer>

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDkuZVoCbhVotMLGi_iI8wGYCrRKie8ex8",

};
const DB = (() => {
  const live = !!FIREBASE_CONFIG.databaseURL && typeof firebase !== 'undefined';
  if (live) {
    firebase.initializeApp(FIREBASE_CONFIG);
    const fdb = firebase.database();
    let offset = 0;

    return {
      mode: 'live', ts: () => firebase.database.ServerValue.TIMESTAMP, now: () => Date.now() + offset,
      set: (p, v) => fdb.ref(p).set(v), update: (p, v) => fdb.ref(p).update(v), remove: p => fdb.ref(p).remove(),
      once: p => fdb.ref(p).once('value').then(s => s.val()),
      on: (p, cb) => { const r = fdb.ref(p); const h = r.on('value', s => cb(s.val())); return () => r.off('value', h); }
    };
  }
  const KEY = 'noahs:tree', subs = [];

  function write(p, v) {

    localStorage.setItem(KEY, JSON.stringify(t)); notify();
  }
  return {

function bindDrag(svg,onPoint,canDrag=()=>true){

  svg.addEventListener('pointerdown',e=>{if(!canDrag())return;drag=true;svg.setPointerCapture(e.pointerId);onPoint(pt(e));e.preventDefault();});
  svg.addEventListener('pointermove',e=>{if(drag)onPoint(pt(e));});

  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
}

/* ---------- expression parser (for Phase 4) ---------- */
function parseExpr(src){
  let s=String(src||'').toLowerCase().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[×·•∙]/g,'*').replace(/²/g,'^2').replace(/÷/g,'/');
  s=s.replace(/^[a-z]=/,'');
  if(!s) throw new Error('empty');
  const toks=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const v=parseFloat(s.slice(i,j));if(isNaN(v))throw new Error('num');toks.push({t:'n',v,raw:s.slice(i,j)});i=j;continue;}
    if(c==='l'||c==='x'){toks.push({t:'v',name:c});i++;continue;}
    if('+-*/^()'.includes(c)){toks.push({t:c});i++;continue;}
    throw new Error('char');
  }
  const out=[];
  toks.forEach((b,k)=>{const a=toks[k-1]; if(a&&(a.t==='n'||a.t==='v'||a.t===')')&&(b.t==='n'||b.t==='v'||b.t==='(')) out.push({t:'*'}); out.push(b);});
  let p=0; const peek=()=>out[p], eat=t=>{if(out[p]&&out[p].t===t){p++;return true;}return false;};
  function expr(){let f=term();while(peek()&&(peek().t==='+'||peek().t==='-')){const op=out[p++].t,g=term(),F=f;f=op==='+'?(x=>F(x)+g(x)):(x=>F(x)-g(x));}return f;}
  function term(){let f=unary();while(peek()&&(peek().t==='*'||peek().t==='/')){const op=out[p++].t,g=unary(),F=f;f=op==='*'?(x=>F(x)*g(x)):(x=>F(x)/g(x));}return f;}
  function unary(){if(eat('-')){const g=unary();return x=>-g(x);}if(eat('+'))return unary();return power();}
  function power(){const b=atom();if(eat('^')){const e=unary();return x=>Math.pow(b(x),e(x));}return b;}
  function atom(){const t=out[p++];if(!t)throw new Error('end');if(t.t==='n')return ()=>t.v;if(t.t==='v')return x=>x;if(t.t==='('){const f=expr();if(!eat(')'))throw new Error('paren');return f;}throw new Error('tok');}
  const f=expr(); if(p!==out.length) throw new Error('extra');
  return {f,hasParen:toks.some(t=>t.t==='('),hasVar:toks.some(t=>t.t==='v'),nums:toks.filter(t=>t.t==='n').map(t=>t.v)};
}
const TESTS=[0.5,1,2,3.7,6,9,13,17.25,22];
function equiv(f,g){return TESTS.every(x=>{const a=f(x),b=g(x);return isFinite(a)&&Math.abs(a-b)<1e-6*(1+Math.abs(b));});}
function tryParse(t){try{return parseExpr(t);}catch(e){return null;}}
function pretty(t){
  return esc(String(t||'').trim().replace(/^[a-zA-Z]\s*=\s*/,'')).replace(/[lL]/g,'L').replace(/\*/g,' · ').replace(/\^2/g,'²').replace(/-/g,' − ').replace(/\+/g,' + ').replace(/\s+/g,' ').replace(/\(\s/g,'(').replace(/\s\)/g,')').trim();
}
function exInput(id,lhs,val,ok){
  return `<div class="exrow"><span class="lhs">${lhs} =</span><input class="ex ${ok?'ok':''}" id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(val||'')}" ${ok?'readonly':''} placeholder="type here"></div>
    ${ok?'':`<div class="keys">${['L','(',')','−','·','²'].map(k=>`<button class="key" data-for="${id}" data-k="${k}">${k}</button>`).join('')}</div><div class="preview" id="${id}Pv"></div>`}`;
}
function bindKeys(root){
  $$('.key',root).forEach(b=>b.onclick=()=>{
    const el=$('#'+b.dataset.for); const map={'−':'-','·':'*','²':'^2'}; const ins=map[b.dataset.k]||b.dataset.k;
    const st=el.selectionStart??el.value.length, en=el.selectionEnd??el.value.length;
    el.value=el.value.slice(0,st)+ins+el.value.slice(en); el.focus(); el.selectionStart=el.selectionEnd=st+ins.length; el.dispatchEvent(new Event('input'));
  });
  $$('.ex',root).forEach(el=>{
    const pv=$('#'+el.id+'Pv'); if(!pv) return;
    const upd=()=>{ const v=el.value.trim(); if(!v){pv.textContent='';return;} pv.innerHTML=tryParse(v)?`Reads as: <b>${pretty(v)}</b>`:'<span style="color:var(--bad)">Check your typing (missing parenthesis?)</span>'; };
    el.addEventListener('input',()=>{el.classList.remove('no');upd();}); upd();
  });
}

/* ---------- PHASE 4 ---------- */
const TBL=[4,10,15];
const CALC=[9,20];
const target=area, avaTarget=L=>L*(18-L);
function buildP4(){
  $('#stage').innerHTML=`<section>
    <div class="intro"><span class="tag">Phase 4</span><h2>Write the equation</h2>
    <p>Can you write <b>one equation</b> that gives the area of Noah's garden for <b>any</b> length? You'll build it yourself, one step at a time.</p></div>
    <div class="split wideL"><div><div class="card sticky">${graphMarkup()}<div class="gnote" id="g4note"></div></div></div><div class="card panel" id="p4panel"></div></div></section>`;
  updP4(false);
}
function drawUser(svg){
  const s=state.p4, g=svg.querySelector('.user'); let h='';
  const last=s.AOk?s.A:(s.ATries.length?s.ATries[s.ATries.length-1]:null);
  const pr=last?tryParse(last):null;
  if(pr){
    h+=`<path class="ucurve ${s.AOk?'ok':'no'}" d="${pathFor(pr.f)}"/>`;
  }
  g.innerHTML=h;
  svg.querySelector('.callouts').innerHTML=pr?`<text class="ulab" x="${GX(14.5)}" y="${GY(163)}" fill="${s.AOk?'#B44A00':'#D64545'}">A = ${pretty(last)}${s.AOk?' ✓':''}</text>`:'';
  $('#g4note').innerHTML=`<span class="lg"><i style="background:var(--blue)"></i>Noah's gardens</span>${pr?(s.AOk?'<span class="lg"><i style="background:var(--orange)"></i>Your equation: it hits every point!</span>':'<span class="lg"><i style="background:var(--bad)"></i>Your last try: does it go through the points?</span>'):''}`;
}
function areaHint(t,pr){
  if(!pr) return 'I can\'t read that. Use L for the length, and check your parentheses.';
  if(!pr.hasVar) return 'Your equation needs <b>L</b> in it, so it works for <b>any</b> length.';
  const f=pr.f, v=f(9);
  const is=g=>equiv(f,g);
  if(is(L=>25-L)) return 'That\'s the <b>width</b>! The area of a rectangle is length × width.';
  if(is(L=>24*L)) return 'So close! Without parentheses, only the 25 gets multiplied by L. Put parentheses around the whole width.';
  if(is(L=>25*L)) return 'The width isn\'t 25. It\'s whatever is left after the length: look back at your width expression.';
  if(is(L=>L*L)) return 'That would be a square with every side L. The width isn\'t L. It\'s 25 − L.';
  if(is(()=>50)||is(L=>2*L+2*(25-L))) return 'That\'s the perimeter (always 50 m). We want the <b>area</b>.';
  if(is(L=>L*(50-L))) return 'Remember: length + width = 25, not 50.';
  return `Test it! When L = 9, your equation gives A = <b>${fmt(v)}</b>, but a 9 m × 16 m garden has an area of <b>144</b> m².`;
}
function updP4(scroll){
  const s=state.p4, svg=$('#stage .graph'), panel=$('#p4panel');
  drawPoints(svg,{all:true,lengths:wholeLengths()});
  drawCurve(svg,false,false); drawCursor(svg,null);
  drawUser(svg);
  const stepHead=(n,title,ok)=>`<h4><span>Step ${n} · ${title}</span>${ok?'<span class="ck">✓ Done</span>':''}</h4>`;
  let h='';
  // Step 1: table
  h+=`<div class="eqStep ${s.tableOk?'doneStep':''}">${stepHead(1,'Fill in the table',s.tableOk)}
    <p>Every garden uses all 50 m of fence. Find the width and area for each length.</p>
    <table class="ptbl"><thead><tr><th>Length (m)</th><th>Width (m)</th><th>Area (m²)</th></tr></thead><tbody>
    ${TBL.map(L=>`<tr><td><b>${L}</b></td><td><input data-t="w${L}" inputmode="decimal" value="${esc(s.table['w'+L]||'')}" ${s.tableOk?'readonly class="ok"':''}></td><td><input data-t="a${L}" inputmode="decimal" value="${esc(s.table['a'+L]||'')}" ${s.tableOk?'readonly class="ok"':''}></td></tr>`).join('')}
    </tbody></table>
    ${s.tableOk?'':'<button class="btn" id="chkT">Check</button>'}<div class="fb" id="fbT"></div></div>`;
  // Step 2: show calculation
  if(s.tableOk) h+=`<div class="eqStep ${s.calcOk?'doneStep':''}">${stepHead(2,'Show how you calculate it',s.calcOk)}
    <p>Don't just give the answer. Write an expression that <b>shows how you find the area</b>, using the fence. Example: for a length of 4, the area is <span class="eq" style="font-size:1.1rem">4 · (25 − 4)</span>.</p>
    ${CALC.map(L=>exInput('c'+L,`Length ${L}: A`,s.calc['c'+L],s.calcOk)).join('')}
    ${s.calcOk?'':'<button class="btn" id="chkC">Check</button>'}<div class="fb" id="fbC"></div></div>`;
  // Step 3: generalize
  if(s.calcOk) h+=`<div class="eqStep ${s.AOk?'doneStep':''}">${stepHead(3,'Any length',s.AOk)}
    <p>Now the length is <b>L</b> meters. Use the same steps you did with numbers.</p>
    <p class="small">a) Write an expression for the <b>width</b>.</p>
    ${exInput('eW','W',s.W,s.WOk)}
    ${s.WOk?`<p class="small" style="margin-top:8px">b) Write an equation for the <b>area</b> of any garden with length L.</p>${exInput('eA','A',s.A,s.AOk)}`:''}
    ${s.AOk?'':`<button class="btn" id="chk3">Check</button>`}<div class="fb ${s.AOk?'ok':''}" id="fb3">${s.AOk?'✓ Your equation goes through every one of Noah\'s gardens. You wrote a <b>quadratic function</b>!':''}</div></div>`;
  // Step 4: another way + abc
  if(s.AOk) h+=`<div class="eqStep ${s.abcOk?'doneStep':''}">${stepHead(4,'Write it another way',s.abcOk)}
    <p>Rewrite your area equation <b>without parentheses</b>.</p>
    ${exInput('eB','A',s.B,s.BOk)}
    ${s.BOk?'':'<button class="btn" id="chkB">Check</button>'}<div class="fb ${s.BOk?'ok':''}" id="fbB">${s.BOk?'✓ Same function, written a different way.':''}</div>
    ${s.BOk?`<p style="margin-top:10px">A <b>quadratic expression</b> can be written as <b>ax² + bx + c</b>, where a ≠ 0. For your area equation, what are a, b, and c?</p>
      <div class="abc"><label>a = <input id="ia" inputmode="decimal" value="${s.abcOk?'-1':''}" ${s.abcOk?'readonly class="ok"':''}></label><label>b = <input id="ib" inputmode="decimal" value="${s.abcOk?'25':''}" ${s.abcOk?'readonly class="ok"':''}></label><label>c = <input id="ic" inputmode="decimal" value="${s.abcOk?'0':''}" ${s.abcOk?'readonly class="ok"':''}></label>${s.abcOk?'':'<button class="btn" id="chkABC">Check</button>'}</div>
      <div class="fb ${s.abcOk?'ok':''}" id="fbABC">${s.abcOk?'✓ a = −1, b = 25, c = 0. The squared term is what makes it quadratic.':''}</div>`:''}</div>`;
  // Step 5: Ava
  if(s.abcOk) h+=`<div class="eqStep ${s.avaMaxOk?'doneStep':''}">${stepHead(5,'Your turn',s.avaMaxOk)}
    <p>Noah's neighbor Ava has <b>36 m</b> of fencing for her rectangular garden. Write an equation for the area of Ava's garden with length L.</p>
    ${exInput('eAva','A',s.ava,s.avaOk)}
    ${s.avaOk?'':'<button class="btn" id="chkAva">Check</button>'}<div class="fb ${s.avaOk?'ok':''}" id="fbAva">${s.avaOk?'✓ With 36 m of fence, L + W = 18.':''}</div>
    ${s.avaOk?`<p style="margin-top:10px">What is the <b>largest area</b> Ava's garden can have?</p>
      <div class="abc"><input class="inl" id="q2" style="width:90px" inputmode="decimal" value="${esc(s.avaMaxOk?'81':s.avaMax)}" ${s.avaMaxOk?'readonly':''}> <span>m²</span>${s.avaMaxOk?'':'<button class="btn" id="chk2">Check</button><button class="btn" id="hint2">Hint</button>'}</div>
      <div class="fb ${s.avaMaxOk?'ok':''}" id="fb2">${s.avaMaxOk?'✓ A 9 m × 9 m square: 81 m².':''}</div>`:''}
    ${s.avaMaxOk?`<div class="celebrate">🎉 <b>You did it!</b> You built your own <b>quadratic function</b> for Noah's garden and Ava's garden. Hang on to Ava's equation. You might see something very similar later today. 👀</div>`:''}</div>`;
  panel.innerHTML=h;
  bindKeys(panel);
  const fb=(id,cls,msg)=>{const e=$('#'+id);e.className='fb '+cls;e.innerHTML=msg;};
  const mark=(el,ok)=>{el.classList.remove('ok','no');el.classList.add(ok?'ok':'no');};
  const pushTry=(arr,t)=>{arr.push(t);if(arr.length>15)arr.shift();};

  // step 1
  $$('[data-t]',panel).forEach(i=>i.oninput=()=>{s.table[i.dataset.t]=i.value;i.classList.remove('no');persist();});
  const cT=$('#chkT'); if(cT) cT.onclick=()=>{
    let all=true, areaWrong=false, widthWrong=false;
    TBL.forEach(L=>{const w=$(`[data-t="w${L}"]`),a=$(`[data-t="a${L}"]`);const wo=num(w.value)===25-L, ao=num(a.value)===area(L);mark(w,wo);mark(a,ao);if(!wo){all=false;widthWrong=true;}if(!ao){all=false;areaWrong=true;}});
    if(all){s.tableOk=true;persist();updP4(true);}
    else fb('fbT','no',widthWrong?'Check the widths. Remember what you noticed in Phase 1: length + width = 25.':'Check the areas: area = length × width.');
  };
  // step 2
  const cC=$('#chkC'); if(cC) cC.onclick=()=>{
    let all=true,msg='';
    CALC.forEach(L=>{const el=$('#c'+L), t=el.value; s.calc['c'+L]=t; const pr=tryParse(t);
      let ok=false;
      if(!pr) msg=msg||`I can't read your expression for length ${L}.`;
      else if(Math.abs(pr.f(0)-area(L))>1e-9) msg=msg||`Check length ${L}: your expression equals ${fmt(pr.f(0))}, but the area is ${fmt(area(L))} m².`;
      else if(!pr.nums.includes(25)) msg=msg||`Right value for length ${L}! Now show <b>how</b> you got it. Use the 25 from the fence in your expression.`;
      else if(pr.hasVar) msg=msg||'Use numbers only here. The length is a number.';
      else ok=true;
      mark(el,ok); if(!ok) all=false;});
    persist();
    if(all){s.calcOk=true;persist();updP4(true);} else fb('fbC','no',msg);
  };
  // step 3
  const c3=$('#chk3'); if(c3) c3.onclick=()=>{
    if(!s.WOk){
      const el=$('#eW'), t=el.value.trim(); s.W=t; const pr=tryParse(t);
      if(pr&&pr.hasVar&&equiv(pr.f,L=>25-L)){ s.WOk=true; persist(); updP4(true); return; }
      mark(el,false); persist();
      let m='Test it: if the length is 10, the width should be 15. What does your expression give?';
      if(!pr) m='I can\'t read that. Use L for the length.';
      else if(!pr.hasVar) m='The width changes when the length changes, so your expression needs <b>L</b> in it.';
      else if(equiv(pr.f,L=>L-25)) m='Flip it around: with a length of 10, the width is 25 − 10, not 10 − 25.';
      else if(equiv(pr.f,L=>50-L)) m='Remember: length + width = 25 (half of the fence), not 50.';
      else m=`Test it: when L = 10, your expression gives ${fmt(pr.f(10))}, but the width should be 15.`;
      fb('fb3','no',m); return;
    }
    const el=$('#eA'), t=el.value.trim(); s.A=t; const pr=tryParse(t);
    if(t) pushTry(s.ATries,t);
    if(pr&&pr.hasVar&&equiv(pr.f,target)){ s.AOk=true; persist(); updP4(true); pushMe(); return; }
    mark(el,false); persist(); drawUser(svg);
    fb('fb3','no',areaHint(t,pr)+(pr&&pr.hasVar?'<br><span class="small">Your try is graphed in red. See where it misses Noah\'s gardens.</span>':''));
  };
  // step 4
  const cB=$('#chkB'); if(cB) cB.onclick=()=>{
    const el=$('#eB'), t=el.value.trim(); s.B=t; const pr=tryParse(t); if(t) pushTry(s.BTries,t);
    if(pr&&equiv(pr.f,target)&&!pr.hasParen){ s.BOk=true; persist(); updP4(true); return; }
    mark(el,false); persist();
    fb('fbB','no',!pr?'I can\'t read that. Use ² (or ^2) for squared.':(pr.hasParen&&equiv(pr.f,target)?'That\'s equivalent, but it still has parentheses. Distribute the L to both terms inside.':'Check your distributing: L · 25 = 25L and L · L = L².'));
  };
  const ca=$('#chkABC'); if(ca) ca.onclick=()=>{
    const want={ia:-1,ib:25,ic:0}; let all=true;
    for(const id in want){const e=$('#'+id), ok=num(e.value)===want[id]; mark(e,ok); if(!ok) all=false;}
    if(all){s.abcOk=true;persist();updP4(true);}
    else fb('fbABC','no',num($('#ia').value)===1?'Look closely at the sign in front of L².':(String($('#ic').value).trim()===''?'There is no constant term. What number does that mean c is?':'Not quite. Write it in the order −L² + 25L, then match each part to ax² + bx + c.'));
  };
  // step 5
  const cAv=$('#chkAva'); if(cAv) cAv.onclick=()=>{
    const el=$('#eAva'), t=el.value.trim(); s.ava=t; const pr=tryParse(t); if(t) pushTry(s.avaTries,t);
    if(pr&&pr.hasVar&&equiv(pr.f,avaTarget)){ s.avaOk=true; persist(); updP4(true); return; }
    mark(el,false); persist();
    let m='Use the same structure as Noah\'s equation. What do the length and width add up to with 36 m of fence?';
    if(!pr) m='I can\'t read that. Use L for the length.';
    else if(equiv(pr.f,L=>L*(36-L))) m='Close! Remember: L + W is only <b>half</b> of the fence.';
    else if(equiv(pr.f,target)) m='That\'s Noah\'s garden (50 m of fence). Ava has 36 m.';
    fb('fbAva','no',m);
  };
  const c2=$('#chk2'); if(c2) c2.onclick=()=>{
    const e=$('#q2'), v=num(e.value); s.avaMax=e.value;
    if(v===81){s.avaMaxOk=true;persist();updP4(true);pushMe();return;}
    mark(e,false); persist();
    fb('fb2','no',v===324?'That would be an 18 m × 18 m square, which needs 72 m of fence.':(v===80||v===77?'Close! Try a length that isn\'t a whole number… or one exactly in the middle.':'Not quite. Try the hint!'));
  };
  const h2=$('#hint2'); if(h2) h2.onclick=()=>fb('fb2','tip','Hint: Noah\'s biggest garden was a square. What square uses exactly 36 m of fence?');
  if(scroll){const steps=$$('.eqStep',panel);const last=steps[steps.length-1];if(last){last.scrollIntoView({behavior:'smooth',block:'nearest'});const inp=last.querySelector('input:not([readonly])');if(inp)setTimeout(()=>inp.focus({preventScroll:true}),300);}}
}

/* ---------- boot ---------- */
(function boot(){
  if(teacherAll) return startSolo();
  const saved=LS.get('noahs:live'), qcode=(params.get('code')||'').toUpperCase(), qname=params.get('name');
  if(qcode&&qname){ showJoin('Joining…'); return joinLive(qcode,qname,!!params.get('demo')); }
  if(saved&&saved.code&&(!qcode||qcode===saved.code)){
    showJoin('Reconnecting…');
    return joinLive(saved.code,saved.name,!!saved.demo).then(()=>{ if(!LIVE){ const e=$('#err'); if(e&&e.textContent==='Reconnecting…') e.textContent=''; } });
  }
  if(LS.get(SOLO_KEY)&&!qcode) return startSolo();
  showJoin();
})();
})();
</script>
